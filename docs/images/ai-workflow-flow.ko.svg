<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="AI 워크플로우: 빈 프로젝트에서 이슈 기반 작업까지" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
